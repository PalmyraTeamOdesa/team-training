<script>if('serviceWorker' in navigator){const _hadSW=!!navigator.serviceWorker.controller;addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_hadSW)location.reload()});}</script>
